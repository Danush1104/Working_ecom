name: Deploy Frontend #Human readable name for the workflow

on:
  push:   #Runs only when files under frontend changes
    branches:
      - main
      - UI
    paths:
      - 'frontend/**'

jobs:
  sonarcloud-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
      
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-deploy: #name of job
    runs-on: ubuntu-latest  #Github hostedUbuntu VM
    steps:
      - name: Checkout Code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a #checkout - pulls code into runnner

      - name: Setup Node.js
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858    #setup - installs node 20 version 
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci          #installs exact versions of dependencies from package-lock.json 

      - name: Build Frontend
        env:
          VITE_COGNITO_REGION: ap-southeast-1
          VITE_COGNITO_USER_POOL_ID: ap-southeast-1_YFOpMiVLd
          VITE_COGNITO_CLIENT_ID: 2fekbicco9blc7v2tg0795k2g1
          VITE_PRODUCT_SERVICE_URL: https://qj1y5ztjwb.execute-api.ap-southeast-1.amazonaws.com/inv/api/products
          VITE_INVENTORY_SERVICE_URL: https://qj1y5ztjwb.execute-api.ap-southeast-1.amazonaws.com/inv/api/inventory
          VITE_CART_SERVICE_URL: https://qj1y5ztjwb.execute-api.ap-southeast-1.amazonaws.com/inv/api/cart
        run: |
          cd frontend
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@0802eece3e41d56906971d94b32d33e05fc4a14c
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          # Sync assets with long-term caching (preserving existing hashed assets)
          aws s3 sync frontend/dist/ s3://${{ secrets.AWS_S3_BUCKET_NAME }} --exclude "index.html"
          # Sync index.html with no-cache header so users always fetch the latest bundle pointers
          aws s3 cp frontend/dist/index.html s3://${{ secrets.AWS_S3_BUCKET_NAME }}/index.html --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront Cache
        run: |
          # Force CloudFront to fetch the new files from S3 instead of serving old cached files
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
