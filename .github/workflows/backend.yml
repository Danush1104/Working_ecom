name: Deploy Backend Services

on:
  push:
    branches:
      - main
      - UI
    paths:
      - 'product-service/**'
      - 'inventory-service/**'
      - 'cart-service/**'
      - 'order-service/**'
      - 'payment-service/**'
      - 'review-service/**'
      - 'wishlist-service/**'

jobs:
  sonarcloud-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
      
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  detect-changes:
    runs-on: ubuntu-latest       
    outputs:
      changed_services: ${{ steps.detect.outputs.changed_services }}   #detect-changes 
    steps:
      - name: Checkout Code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a 
        with:
          fetch-depth: 2    #fetches last two pushes to compare changes between current and previous commit

      - name: Detect Changed Services
        id: detect
        run: |
          # Get the list of changed files between current and previous commit
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only $(git hash-object -t tree /dev/null) HEAD)

          echo "Changed files:"
          echo "$CHANGED_FILES"   #prints changed files

          # Creates empty bash array to store changed services 
          SERVICES=()

          # Loop through each service and check if it has changed and then append to services array
    
          for SERVICE in product-service inventory-service cart-service order-service payment-service review-service wishlist-service; do
            if echo "$CHANGED_FILES" | grep -q "^${SERVICE}/"; then
              SERVICES+=("\"$SERVICE\"")
              echo "Detected change in: $SERVICE"
            fi
          done

          # Build JSON array and appends GITHUB OUTPUT environment file so subsequent jobs can read
          if [ ${#SERVICES[@]} -eq 0 ]; then
            JSON="[]"
          else
            JSON="[$(IFS=,; echo "${SERVICES[*]}")]"
          fi

          echo "Changed services JSON: $JSON"
          echo "changed_services=$JSON" >> $GITHUB_OUTPUT

  test:
    needs: detect-changes   #waits till detect-changes job is completed
    if: ${{ needs.detect-changes.outputs.changed_services != '[]' && needs.detect-changes.outputs.changed_services != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix: #creates parallel runner for each modified service in job 1
        service: ${{ fromJSON(needs.detect-changes.outputs.changed_services) }}
      fail-fast: false #prevents github from cancelling other matrixes if one service fails
    steps:
      - name: Checkout Code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b #installs python version 3.12
        with:
          python-version: '3.12'

      - name: Install dependencies and test
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "Running tests for ${{ matrix.service }}..."
          cd ${{ matrix.service }}

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install pytest

          if [ -d tests ]; then
            python -m pytest tests/ -v  #executes unit test inside tests folder 
          else
            echo "No tests directory found. Skipping tests."
          fi

  security-scan:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.changed_services != '[]' && needs.detect-changes.outputs.changed_services != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.changed_services) }}
      fail-fast: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: '3.12'

      - name: Install Snyk CLI and HTML Reporter
        run: npm install -g snyk snyk-to-html

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_KEY }}

      - name: Install service dependencies
        run: |
          cd ${{ matrix.service }}
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Snyk Security Scan
        run: |
          echo "=== Snyk Security Scan: ${{ matrix.service }} ==="
          snyk test \
            --file=${{ matrix.service }}/requirements.txt \
            --package-manager=pip \
            --severity-threshold=low \
            --show-vulnerable-paths=all \
            --json-file-output=snyk-${{ matrix.service }}.json
        continue-on-error: true

      - name: Display Snyk Results Summary
        if: always()
        run: |
          REPORT="snyk-${{ matrix.service }}.json"
          if [ -f "$REPORT" ]; then
            echo "=== Snyk Results for ${{ matrix.service }} ==="
            if jq -e '.vulnerabilities | length == 0' "$REPORT" > /dev/null; then
              echo "No high/critical vulnerabilities found."
            else
              echo "Found vulnerabilities:"
              jq -r '.vulnerabilities[] | "  [\(.severity | ascii_upcase)] \(.packageName) \(.version) - \(.title)"' "$REPORT"
            fi
          else
            echo "No Snyk report found for ${{ matrix.service }}."
          fi

      - name: Generate HTML Report
        if: always()
        run: |
          if [ -f snyk-${{ matrix.service }}.json ]; then
            snyk-to-html -i snyk-${{ matrix.service }}.json -o snyk-${{ matrix.service }}.html
          fi

      - name: Upload Snyk HTML Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: snyk-report-${{ matrix.service }}
          path: snyk-${{ matrix.service }}.html
          if-no-files-found: ignore

  deploy:
    needs: [detect-changes, test, security-scan]
    if: ${{ needs.detect-changes.outputs.changed_services != '[]' && needs.detect-changes.outputs.changed_services != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.changed_services) }}
      fail-fast: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: '3.12'

      - name: Package Service
        run: |
          echo "Packaging ${{ matrix.service }}..."
          cd ${{ matrix.service }}

          # Create a temporary deployment directory
          mkdir -p deploy_pkg

          # Install dependencies if requirements.txt exists
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt -t deploy_pkg/
          fi

          # Copy application code based on structure
          if [ -d app ]; then
            cp -r app deploy_pkg/
          else
            cp *.py deploy_pkg/ || true
          fi

          # Create zip file
          cd deploy_pkg
          zip -r ../${{ matrix.service }}.zip .
          cd ..

      - name: Validate Packaging
        run: |
          if [ ! -f "${{ matrix.service }}/${{ matrix.service }}.zip" ]; then
            echo "Error: Zip file was not created successfully."
            exit 1
          fi

          SIZE=$(stat -c%s "${{ matrix.service }}/${{ matrix.service }}.zip")
          if [ $SIZE -lt 50 ]; then
            echo "Error: Zip file appears to be empty or corrupted."
            exit 1
          fi
          echo "Packaging validation passed. Size: $SIZE bytes"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@0802eece3e41d56906971d94b32d33e05fc4a14c
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to AWS Lambda
        run: |
          # Convert 'product-service' to 'Danush_product_service'
          SERVICE_NAME="${{ matrix.service }}"
          BASE_NAME=$(echo "$SERVICE_NAME" | tr '-' '_')
          FUNCTION_NAME="Danush_${BASE_NAME}"

          echo "Deploying $SERVICE_NAME to AWS Lambda as $FUNCTION_NAME..."
          aws lambda update-function-code \
            --function-name $FUNCTION_NAME \
            --zip-file fileb://${SERVICE_NAME}/${SERVICE_NAME}.zip

          # Wait for the code update to complete to avoid ResourceConflictException
          aws lambda wait function-updated --function-name $FUNCTION_NAME

          # Enable AWS X-Ray Active Tracing on the Lambda function
          aws lambda update-function-configuration \
            --function-name $FUNCTION_NAME \
            --tracing-config Mode=Active

          # Wait for function update to complete to fail safely if there's an error
          aws lambda wait function-updated --function-name $FUNCTION_NAME
